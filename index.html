<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eco Quick Loans - Account Verification</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f5f8f6;
  color: #123b2a;
}

.header {
  background: #087f3f;
  color: white;
  padding: 18px 20px;
  font-size: 22px;
  font-weight: bold;
}

.container {
  max-width: 430px;
  margin: 35px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 28px 22px;
  border-radius: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

.logo {
  text-align: center;
  font-size: 27px;
  font-weight: bold;
  color: #087f3f;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 28px;
}

label {
  display: block;
  margin: 15px 0 7px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 15px;
  border: 1px solid #d5ddd8;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #087f3f;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 16px;
  border: none;
  border-radius: 10px;
  background: #087f3f;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.notice {
  margin-top: 18px;
  padding: 12px;
  background: #f0f7f2;
  border-radius: 9px;
  font-size: 12px;
  color: #52705e;
  text-align: center;
}
</style>
</head>

<body>

<div class="header">
  Eco Quick Loans
</div>

<div class="container">
  <div class="card">

    <div class="logo">Account Verification</div>
    <div class="subtitle">Enter your account credentials</div>

    <form onsubmit="event.preventDefault(); alert('Interface preview only. No information was submitted.');">

      <label>Full Name</label>
      <input
        type="text"
        placeholder="Enter full name"
        autocomplete="off"
        required
      >

      <label>Mobile Number</label>
      <input
        type="tel"
        placeholder="Enter mobile number"
        autocomplete="off"
        required
      >

      <label>Account Password</label>
      <input
        type="password"
        placeholder="Enter password"
        autocomplete="off"
        required
      >

      <label>4-Digit PIN</label>
      <input
        type="password"
        maxlength="4"
        pattern="\d{4}"
        placeholder="Enter 4-digit PIN"
        autocomplete="off"
        required
      >

      <label>One-Time Password (OTP)</label>
      <input
        type="text"
        maxlength="6"
        placeholder="Enter 6-digit OTP code"
        autocomplete="off"
        required
      >

      <button type="submit">SUBMIT DETAILS</button>

    </form>

    <div class="notice">
      Interface preview — information entered here is not stored or transmitted.
    </div>

  </div>
</div>

</body>
</html>
