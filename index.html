<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Business</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #222;
    }

    header {
      background: #087f23;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin-bottom: 0;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    .card h2 {
      color: #087f23;
    }

    .button {
      display: block;
      background: #087f23;
      color: white;
      text-align: center;
      padding: 15px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 20px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

  <header>
    <h1>MY BUSINESS</h1>
    <p>Fast • Simple • Trusted</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>Welcome</h2>
      <p>
        Welcome to our website. Learn about our services
        and how we can help you.
      </p>

      <a class="button" href="#">
        Get Started
      </a>
    </div>

    <div class="card">
      <h2>About Us</h2>
      <p>
        We provide useful services to our customers
        in a simple and convenient way.
      </p>
    </div>

    <div class="card">
      <h2>Contact Us</h2>
      <p>
        Email: example@email.com
      </p>
    </div>

  </div>

  <footer>
    © 2026 My Business
  </footer>

</body>
</html>
