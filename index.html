<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Application</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f5;
      color: #222;
    }

    header {
      background: white;
      padding: 18px 25px;
      font-size: 28px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
    }

    .logo {
      color: #4267c9;
    }

    main {
      max-width: 650px;
      margin: 60px auto;
      background: white;
      padding: 35px;
      border-radius: 22px;
    }

    h1 {
      text-align: center;
      font-size: 40px;
      margin-bottom: 15px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 20px;
      margin-bottom: 40px;
    }

    .calculator {
      background: #f7f8fa;
      padding: 30px;
      border-radius: 18px;
    }

    h2 {
      margin-top: 0;
    }

    .row {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      margin: 25px 0 10px;
    }

    .value {
      color: #526fc8;
      font-weight: bold;
    }

    input[type="range"] {
      width: 100%;
    }

    .payment {
      background: white;
      border: 1px solid #ddd;
      border-radius: 15px;
      padding: 25px;
      margin-top: 30px;
      font-size: 21px;
    }

    .payment strong {
      color: #526fc8;
      font-size: 34px;
      float: right;
    }

    button {
      width: 100%;
      margin-top: 30px;
      padding: 20px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #526fd0, #a14ed0);
      color: white;
      font-size: 21px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      main {
        margin: 30px 15px;
        padding: 25px;
      }

      h1 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

<header>
  <span class="logo">Your Loan</span>
</header>

<main>

  <h1>Get Your Loan Approved Fast</h1>

  <div class="subtitle">
    Quick application • Flexible terms • Clear repayment
  </div>

  <div class="calculator">

    <h2>Loan Calculator</h2>

    <div class="row">
      <span>Loan Amount</span>
      <span class="value">$<span id="amount">5000</span></span>
    </div>

    <input
      type="range"
      id="amountSlider"
      min="100"
      max="5000"
      step="100"
      value="5000"
    >

    <div class="row">
      <span>Loan Term</span>
      <span class="value"><span id="term">12</span> months</span>
    </div>

    <input
      type="range"
      id="termSlider"
      min="6"
      max="60"
      step="6"
      value="12"
    >

    <div class="payment">
      Monthly Payment
      <strong>$<span id="payment">450</span></strong>
    </div>

  </div>

  <button onclick="applyNow()">APPLY NOW</button>

</main>

<script>
  const amountSlider = document.getElementById("amountSlider");
  const termSlider = document.getElementById("termSlider");

  const amount = document.getElementById("amount");
  const term = document.getElementById("term");
  const payment = document.getElementById("payment");

  function calculate() {
    const loan = Number(amountSlider.value);
    const months = Number(termSlider.value);

    amount.textContent = loan.toLocaleString();
    term.textContent = months;

    // Example calculation only.
    // Replace this with your actual disclosed loan terms.
    const monthly = loan / months;
    payment.textContent = Math.round(monthly).toLocaleString();
  }
