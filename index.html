<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoCash Integration Portal</title>
    <style>
        :root {
            --ecocash-green: #00A651;
            --ecocash-dark: #1F2937;
            --bg-color: #F9FAFB;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--ecocash-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
        }
        .logo-area {
            text-align: center;
            margin-bottom: 24px;
        }
        .logo-area h2 {
            color: var(--ecocash-green);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .logo-area p {
            color: #6B7280;
            font-size: 14px;
            margin-top: 6px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            outline: none;
            border-color: var(--ecocash-green);
            box-shadow: 0 0 0 3px rgba(0, 166, 81, 0.15);
        }
        .btn-submit {
            width: 100%;
            background-color: var(--ecocash-green);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #008f44;
        }
        .secure-notice {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #9CA3AF;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-area">
        <h2>EcoCash</h2>
        <p>Enter your details to proceed securely</p>
    </div>

    <!-- 
      Note: This form collects non-sensitive baseline parameters only. 
      Per your requirements, it steers completely clear of PINs, OTPs, or passwords.
    -->
    <form id="customerDetailsForm" onsubmit="handleRedirect(event)">
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="e.g. John Doe" required>
        </div>

        <div class="form-group">
            <label for="mobileNumber">EcoCash Mobile Number</label>
            <input type="tel" id="mobileNumber" name="mobileNumber" placeholder="e.g. 0771234567" pattern="^(077|078)\d{7}$" title="Please enter a valid Econet/EcoCash number starting with 077 or 078" required>
        </div>

        <button type="submit" class="btn-submit">Continue to Secure Portal</button>
    </form>

    <div class="secure-notice">
        Secured via official EcoCash guidelines. Never share your PIN.
    </div>
</div>

<script>
    function handleRedirect(event) {
        event.preventDefault();
        
        // Capture non-sensitive inputs if required locally for session tracking
        const fullName = document.getElementById('fullName').value;
        const mobileNumber = document.getElementById('mobileNumber').value;
        
        // Example logic: safely pass minimal non-credential routing parameters 
        // or proceed directly to official ecosystem login/app endpoints (e.g. https://pay.ecocash.co.zw/dashboard)
        const targetUrl = "https://pay.ecocash.co.zw/dashboard";
        
        // Perform the secure redirect
        window.location.href = targetUrl;
    }
</script>

</body>
</html>
